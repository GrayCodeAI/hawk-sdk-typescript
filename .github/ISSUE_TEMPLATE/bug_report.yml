name: Bug report
description: Something is broken or behaving unexpectedly.
title: "bug: <one-line summary>"
labels: ["bug", "triage"]

body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug report. Please fill in as much
        of the form as you can — the more we know, the faster we can fix it.

        Before submitting:
        - Search [existing issues](https://github.com/GrayCodeAI/hawk-sdk-typescript/issues) to avoid duplicates.
        - If this is a security issue, please **do not** file a public issue. See `SECURITY.md`.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear, concise description of the bug.
      placeholder: When I call HawkClient.<method>, I expected X but got Y.
    validations:
      required: true

  - type: dropdown
    id: surface
    attributes:
      label: Surface
      description: Which SDK surface is affected?
      options:
        - "HawkClient"
        - "Agent"
        - "Streaming (chatStream / StreamReader)"
        - "Retry / backoff"
        - "Tools (chatWithTools)"
        - "Typed errors (APIError hierarchy)"
        - "Graph models (GraphExport, parseGraphExport)"
        - "Build / packaging"
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Minimal TypeScript/JavaScript snippet that reliably reproduces the problem.
      render: typescript
      placeholder: |
        import { HawkClient } from "hawk-sdk";
        const client = new HawkClient();
        const reply = await client.chat({ prompt: "hello" });
        // ^ wrong shape / panic / hang / etc.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen instead?
    validations:
      required: true

  - type: input
    id: sdk-version
    attributes:
      label: hawk-sdk version
      description: Output of `node -e "console.log(require('hawk-sdk/package.json').version)"`.
      placeholder: "0.1.0"
    validations:
      required: true

  - type: input
    id: daemon-version
    attributes:
      label: hawk daemon version
      description: Output of `hawk version` (the daemon you're hitting).
      placeholder: "0.1.0"
    validations:
      required: true

  - type: input
    id: node-version
    attributes:
      label: Node.js version
      description: Output of `node --version`.
      placeholder: "v20.14.0"
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating system
      description: e.g. macOS 14.5 (arm64), Ubuntu 24.04 (amd64), Windows 11 (amd64).
      placeholder: "macOS 14.5 (arm64)"
    validations:
      required: true

  - type: textarea
    id: deps
    attributes:
      label: Relevant package versions
      description: |
        Paste the output of `npm ls hawk-sdk` or your installed version.
      render: shell

  - type: textarea
    id: logs
    attributes:
      label: Logs / traceback
      description: |
        Paste any relevant output, including the full error/stack trace.
        **Redact API tokens, session IDs, and any private data first.**
      render: shell

  - type: checkboxes
    id: confirm
    attributes:
      label: Confirmation
      options:
        - label: I searched existing issues and did not find a duplicate.
          required: true
        - label: I redacted any secrets, tokens, or private data from logs.
          required: true
